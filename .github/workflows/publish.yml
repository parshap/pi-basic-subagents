name: Publish

on:
  push:
    tags: ["v*"]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Creates the GitHub release.
      contents: write
      # npm trusted publishing (OIDC): no token secret, and provenance is attached automatically.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Tags and history, for the release notes.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: latest
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Tag matches package.json version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm publish --access public
      - run: npx git-cliff --latest --strip all --output notes.md
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
